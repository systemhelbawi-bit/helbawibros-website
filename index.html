<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلباوي إخوان | أجود أنواع الحبوب والبهارات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Cairo for Arabic, Playfair Display for headers, Inter for Body) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#991B1B',      /* الأحمر العريق */
                            gold: '#D97706',     /* الذهبي الدافئ */
                            dark: '#111827',     /* الغامق */
                            cream: '#FEFBF3',    /* الكريمي الفاتح والخلفيات */
                            clay: '#F5F2EB'      /* خلفيات الكروت */
                        }
                    },
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-overlay {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.80) 0%, rgba(17, 24, 39, 0.55) 50%, rgba(17, 24, 39, 0.85) 100%);
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-brand-cream text-gray-800 font-sans transition-all duration-300">
